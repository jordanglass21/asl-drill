[project]
name = "asl-drill-training"
version = "0.1.0"
description = "Data preparation and classifier training for ASL Drill"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.3.0",
    "numpy>=2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8"]
render = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asl_drill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
